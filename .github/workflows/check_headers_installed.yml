name: Check Headers Installed

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
    check-headers-installed:
      name: Check every header has register_headers install logic
      runs-on: ubuntu-24.04

      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: check headers are registered for install
          run: ./utils/scripts/check_headers_installed.sh
